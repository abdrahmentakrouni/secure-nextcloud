# Nextcloud reverse proxy - TLS 1.2/1.3 only, login rate limiting.
# Mounted read-only into /etc/nginx/conf.d/nextcloud.conf

upstream php-handler {
    server app:9000;
}

# Login brute-force mitigation: 10 requests/min per IP, small burst.
limit_req_zone $binary_remote_addr zone=nc_login:1m rate=10r/m;

# Everything on plain HTTP is redirected - nothing is ever served unencrypted.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge path kept HTTP-only for future Let's Encrypt use.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /var/www/html;

    client_max_body_size 10G;
    client_body_timeout 3600s;
    fastcgi_buffers 64 4K;
    fastcgi_read_timeout 3600s;

    # TLS: Mozilla intermediate profile, no DHE suites (no dhparam needed).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:nc_ssl:10m;
    ssl_session_tickets off;

    # HSTS: force HTTPS in browsers for 2 years (nginx owns this header).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Rate-limited login endpoint.
    location ^~ /login {
        limit_req zone=nc_login burst=5 nodelay;
        try_files $uri $uri/ /index.php$request_uri;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_pass php-handler;
    }

    # Never serve dotfiles (except .well-known).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Never serve internal application paths.
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
        return 404;
    }

    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        return 404;
    }
}
