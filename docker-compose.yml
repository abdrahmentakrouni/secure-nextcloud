name: secure-nextcloud

services:
  db:
    image: mariadb:11.4
    container_name: nc-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nc-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_HOST_PASSWORD}"]
    environment:
      REDIS_HOST_PASSWORD: ${REDIS_HOST_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_HOST_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: nextcloud:31-fpm
    container_name: nc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_HOST_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "${NC_DOMAIN} localhost"
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 10G
      TZ: ${TZ}
    volumes:
      - nextcloud:/var/www/html
      - nextcloud-data:/var/www/html/data
      - ./config/php-hardening.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
    networks:
      - frontend
      - backend

  cron:
    image: nextcloud:31-fpm
    container_name: nc-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_HOST_PASSWORD}
      TZ: ${TZ}
    volumes:
      - nextcloud:/var/www/html
      - nextcloud-data:/var/www/html/data
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: nc-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mounted as default.conf so it REPLACES the image's stock server block
      # (which would otherwise answer on port 80 with server_name localhost).
      - ./nginx/conf.d/nextcloud.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nextcloud:/var/www/html:ro
      - nextcloud-data:/var/www/html/data:ro
    networks:
      - frontend

volumes:
  db-data:
  nextcloud:
  nextcloud-data:

networks:
  frontend:
  backend:
    internal: true
