; Hardened PHP defaults for the Nextcloud container.
; Mounted read-only into /usr/local/etc/php/conf.d/zz-hardening.ini

; Do not disclose PHP presence in response headers.
expose_php = Off

; Session cookies: JS never touches them, HTTPS only, strict ID handling.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.gc_maxlifetime = 86400

; Required so occ (CLI) works when APCu is the local cache.
apc.enable_cli = 1

; Opcode cache sized for Nextcloud's code base.
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
