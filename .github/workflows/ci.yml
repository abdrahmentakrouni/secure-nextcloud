name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck 0.9.0
        run: |
          curl -sSL -o /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.9.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint .

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config -q

  certs:
    name: TLS certificate tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate local CA and certificate
        env:
          NC_DOMAIN: nextcloud.local
        run: bash scripts/gen-certs.sh

      - name: Verify chain, SAN and key permissions
        run: |
          openssl verify -CAfile certs/ca.crt certs/server.crt
          openssl x509 -in certs/server.crt -noout -ext subjectAltName | grep -q "DNS:nextcloud.local"
          test "$(stat -c %a certs/server.key)" = "600"
          echo "Certificate tooling verified"

  smoke:
    name: Full-stack security test
    runs-on: ubuntu-latest
    needs: [lint, compose, certs]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/ChangeMe_Admin_2026/Ci-Admin-Kx9m2p/; s/ChangeMe_Root_2026/Ci-Root-Vq4nz8/; s/ChangeMe_DB_2026/Ci-Db-Rt7yw5/; s/ChangeMe_Redis_2026/Ci-Redis-Jb3xf6/; s/# DEMO_USERS_PASSWORD=ChangeMe_Demo_2026/DEMO_USERS_PASSWORD=Ci-Demo-Qw7rn4/' .env
          chmod 600 .env

      - name: Generate TLS certificates
        run: bash scripts/gen-certs.sh

      - name: Boot the stack
        run: docker compose up -d

      - name: Run the full security pipeline
        run: bash tests/smoke-test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
